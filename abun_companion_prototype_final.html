<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>阿文 AI 陪伴角色測試</title>
<style>
  :root {
    --bg: #FFF8EC;
    --panel: #FFFFFF;
    --ink: #2B2A27;
    --muted: #8A8577;
    --accent: #F0A020;
    --accent-deep: #D9820A;
    --accent-soft: #FFF0D6;
    --border: #F0E4C8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
  }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .stage-bg {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: radial-gradient(circle at 50% 40%, var(--accent-soft), transparent 70%);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .char-img {
    width: 78%;
    transform-origin: 50% 60%;
    animation: breathe 3.2s ease-in-out infinite;
    filter: drop-shadow(0 8px 14px rgba(217,130,10,0.18));
  }
  .char-img.talking {
    animation: talk-bounce 0.45s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.035) translateY(-4px); }
  }
  @keyframes talk-bounce {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.05) rotate(-1.5deg); }
  }
  .char-name {
    margin-top: 14px;
    font-size: 16px;
    font-weight: 600;
  }
  .char-status {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin: 16px 0 6px;
    text-align: left;
  }
  textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    background: #FFFCF5;
    resize: vertical;
    min-height: 110px;
    line-height: 1.5;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
  }
  .apply-btn {
    width: 100%;
    margin-top: 12px;
    padding: 10px;
    background: var(--accent-deep);
    color: #fff;
  }
  .chat-col {
    display: flex;
    flex-direction: column;
    min-height: 560px;
  }
  .chat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .avatar-mini {
    width: 38px; height: 38px;
    border-radius: 50%;
    overflow: hidden;
    background: var(--accent-soft);
    flex-shrink: 0;
  }
  .avatar-mini img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.5); }
  .mini-name { font-size: 14px; font-weight: 600; }
  .mini-status { font-size: 12px; color: var(--muted); }
  .messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-right: 4px;
    max-height: 440px;
  }
  .msg {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent-deep);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--accent-soft);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .msg.system-note {
    align-self: center;
    color: var(--muted);
    font-size: 12px;
    background: transparent;
  }
  .composer {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .composer input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 14px;
    background: #FFFCF5;
    color: var(--ink);
  }
  .send-btn {
    padding: 0 18px;
    background: var(--ink);
    color: #fff;
    border-radius: 20px;
  }
  .send-btn:disabled { opacity: 0.5; cursor: default; }
</style>

let history = [];
let systemPrompt = document.getElementById('systemPrompt').value;

const messagesEl = document.getElementById('messages');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const applyBtn = document.getElementById('applyBtn');
const charImg = document.getElementById('charImg');
const miniImg = document.getElementById('miniImg');
const stageStatus = document.getElementById('stageStatus');

function setFace(key) {
  if (!FACES[key]) return;
  const src = 'data:image/png;base64,' + FACES[key];
  charImg.src = src;
  miniImg.src = src;
}

function setTalking(isTalking) {
  charImg.classList.toggle('talking', isTalking);
  stageStatus.textContent = isTalking ? '說話中...' : '待機中';
}

function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : role === 'bot' ? 'bot' : 'system-note');
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function extractEmotion(text) {
  const m = text.match(/\[emotion:\s*([a-z_]+)\s*\]/i);
  let clean = text.replace(/\[emotion:[^\]]*\]/i, '').trim();
  return { clean, emotion: m ? m[1] : null };
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;
  userInput.value = '';
  sendBtn.disabled = true;

  addMessage('user', text);
  history.push({ role: 'user', content: text });
  setTalking(true);

  const typingEl = addMessage('bot', '……輸入中');

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        max_tokens: 500,
        system: systemPrompt,
        messages: history
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    const raw = textBlock ? textBlock.text : '(沒有收到回覆,請再試一次)';
    const { clean, emotion } = extractEmotion(raw);

    typingEl.remove();
    addMessage('bot', clean);
    history.push({ role: 'assistant', content: raw });

    if (emotion) setFace(emotion);
    speak(clean);
  } catch (err) {
    typingEl.remove();
    addMessage('system-note', '發生錯誤,請再試一次。');
    console.error(err);
  } finally {
    setTalking(false);
    sendBtn.disabled = false;
    userInput.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

// ---- 語音輸入 (Speech Recognition) ----
const micBtn = document.getElementById('micBtn');
const voiceToggle = document.getElementById('voiceToggle');
const voiceStatus = document.getElementById('voiceStatus');
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SpeechRecognitionAPI) {
  const recognition = new SpeechRecognitionAPI();
  recognition.lang = 'zh-TW';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let listening = false;

  recognition.addEventListener('start', () => {
    listening = true;
    micBtn.style.background = 'var(--accent-deep)';
    micBtn.style.color = '#fff';
    voiceStatus.textContent = '聽你說話中...';
  });

  recognition.addEventListener('end', () => {
    listening = false;
    micBtn.style.background = '';
    micBtn.style.color = '';
    voiceStatus.textContent = '';
  });

  recognition.addEventListener('result', (e) => {
    const transcript = e.results[0][0].transcript;
    userInput.value = transcript;
    sendMessage();
  });

  recognition.addEventListener('error', (e) => {
    voiceStatus.textContent = '語音辨識出錯 (' + e.error + ')';
  });

  micBtn.addEventListener('click', () => {
    if (listening) {
      recognition.stop();
    } else {
      recognition.start();
    }
  });
} else {
  micBtn.disabled = true;
  micBtn.title = '這個瀏覽器不支援語音輸入';
  voiceStatus.textContent = '此瀏覽器不支援語音輸入,建議用電腦版 Chrome';
}

// ---- 語音輸出 (Speech Synthesis) ----
function speak(text) {
  if (!voiceToggle.checked) return;
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-TW';
  utter.rate = 1.05;
  utter.pitch = 1.15;
  window.speechSynthesis.speak(utter);
}

applyBtn.addEventListener('click', () => {
  systemPrompt = document.getElementById('systemPrompt').value;
  history = [];
  messagesEl.innerHTML = '';
  setFace('le');
  addMessage('system-note', '已套用新的人設,對話重新開始');
});

addMessage('system-note', '跟阿文打個招呼看看吧');
</script>
